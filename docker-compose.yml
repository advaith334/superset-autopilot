name: autopilot

services:
  # ──────────── Backend ────────────
  app:
    build: ./backend
    container_name: autopilot
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ${SUPERSET_FORK_PATH:-../superset}:/superset-fork:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ──────────── Data plane ────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autopilot-postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────── Metrics ────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: autopilot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

volumes:
  postgres-data:
  prometheus-data:
